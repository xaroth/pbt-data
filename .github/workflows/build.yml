name: build

# Builds league datasets from their source.json. On a pull request it builds every league whose
# source.json changed, or every league when this workflow or the Steam login changed (such as a new
# PBT_EXTRACT), and pushes the datasets onto the pull request. Run by hand, it builds one league
# and opens a pull request.
on:
  pull_request:
    paths:
      - poe1/*/source.json
      - .github/workflows/build.yml
      - scripts/steam-code.py
  workflow_dispatch:
    inputs:
      league:
        description: League folder under poe1/, such as 3.29
        required: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: build-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  # Bump to rebuild every league with a newer extractor.
  PBT_EXTRACT: e4f5c6ea7c2272b4d8840b0992056e6c9410232c
  OOZ: ff5aeb9e45e362e8d6bb1199aa82406285dd2a18
  DEPOT_DOWNLOADER: DepotDownloader_3.4.0
  STEAM_APP: "238960"
  STEAM_DEPOT: "238961"

jobs:
  leagues:
    # Pull requests from forks get no secrets.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      leagues: ${{ steps.list.outputs.leagues }}
    steps:
      # The pull request's own commit, not its merge with main: publish writes into the branch.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - id: list
        env:
          INPUT_LEAGUE: ${{ inputs.league }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            leagues=$INPUT_LEAGUE
          else
            # Since the branch left main, so main's later changes are not counted.
            changed=$(git diff --name-only "$BASE...$HEAD")
            if grep -qE '^(\.github/workflows/build\.yml|scripts/steam-code\.py)$' <<< "$changed"; then
              leagues=$(ls poe1/*/source.json | cut -d/ -f2)
            else
              leagues=$(grep -E '^poe1/[^/]+/source\.json$' <<< "$changed" | while read -r f; do [ -f "$f" ] && echo "$f"; done | cut -d/ -f2)
            fi
          fi
          json=$(printf '%s\n' $leagues | jq -Rnc '[inputs | select(length > 0)]')
          echo "leagues: $json"
          echo "leagues=$json" >> "$GITHUB_OUTPUT"

  build:
    needs: leagues
    if: needs.leagues.outputs.leagues != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # One Steam login at a time.
      max-parallel: 1
      matrix:
        league: ${{ fromJSON(needs.leagues.outputs.leagues) }}
    env:
      LEAGUE: ${{ matrix.league }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Read source.json
        run: |
          src=poe1/$LEAGUE/source.json
          for f in version steamManifest datSchemaCommit treeExportCommit; do
            v=$(jq -er ".$f" "$src")
            echo "$f=$v" >> "$GITHUB_ENV"
          done

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: false

      - name: Install pbt-extract
        run: GOBIN="$RUNNER_TEMP/bin" go install "github.com/xaroth/pbt-extract@$PBT_EXTRACT" && echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Cache ooz
        id: ooz
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/ooz
          key: ooz-${{ env.OOZ }}

      - name: Build ooz
        if: steps.ooz.outputs.cache-hit != 'true'
        run: |
          sudo apt-get install -y -qq libsodium-dev > /dev/null
          git clone -q https://github.com/zao/ooz "$RUNNER_TEMP/ooz-src"
          cd "$RUNNER_TEMP/ooz-src"
          git checkout -q "$OOZ"
          git submodule update -q --init
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target ooz -j
          mkdir -p "$RUNNER_TEMP/ooz" && cp build/ooz "$RUNNER_TEMP/ooz/"

      - name: Install DepotDownloader
        run: |
          gh release download "$DEPOT_DOWNLOADER" -R SteamRE/DepotDownloader -p DepotDownloader-linux-x64.zip -D "$RUNNER_TEMP"
          unzip -q "$RUNNER_TEMP/DepotDownloader-linux-x64.zip" -d "$RUNNER_TEMP/bin"
          chmod +x "$RUNNER_TEMP/bin/DepotDownloader"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Schema
        run: |
          git clone -q --filter=blob:none https://github.com/poe-tool-dev/dat-schema "$RUNNER_TEMP/dat-schema"
          cd "$RUNNER_TEMP/dat-schema"
          git -c advice.detachedHead=false checkout -q "$datSchemaCommit"
          npm ci --ignore-scripts --no-audit --no-fund --loglevel=error
          npm exec --no -- tsc
          node dist/cli.js > /dev/null
          mkdir -p "$RUNNER_TEMP/in"
          # validFor 1 is PoE1; older commits only write the combined schema.
          node -e '
          const fs = require("fs");
          const s = JSON.parse(fs.readFileSync("schema.min.json", "utf8"));
          const keep = (e) => (e.validFor & 1) !== 0;
          fs.writeFileSync(process.argv[1], JSON.stringify({ ...s, tables: s.tables.filter(keep), enumerations: s.enumerations.filter(keep) }));
          ' "$RUNNER_TEMP/in/schema.json"

      - name: Tree export
        run: |
          git clone -q --filter=blob:none --no-checkout https://github.com/grindinggear/skilltree-export "$RUNNER_TEMP/tree-src"
          cd "$RUNNER_TEMP/tree-src"
          git sparse-checkout set --no-cone /data.json /ruthless.json /alternate.json /assets/
          git -c advice.detachedHead=false checkout -q "$treeExportCommit"
          mkdir -p "$RUNNER_TEMP/in/tree"
          cp -r data.json ruthless.json alternate.json assets "$RUNNER_TEMP/in/tree/"

      # The CDN serves the live patch without a login; Steam serves any patch by manifest id.
      - name: Game files
        env:
          STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
          STEAM_PASSWORD: ${{ secrets.STEAM_PASSWORD }}
          STEAM_SHARED_SECRET: ${{ secrets.STEAM_SHARED_SECRET }}
        run: |
          in=$RUNNER_TEMP/in
          cdn=https://patch.poecdn.com/$version
          bundles() {
            pbt-extract -ooz "$RUNNER_TEMP/ooz/ooz" bundles "$in" > "$RUNNER_TEMP/bundles.txt"
            echo "$(wc -l < "$RUNNER_TEMP/bundles.txt") bundles"
          }
          # A code is accepted once; another build may have used the current one, so a failed
          # attempt retries with the next.
          steam() {
            for attempt in 1 2 3; do
              python3 -I scripts/steam-code.py | DepotDownloader -app "$STEAM_APP" -depot "$STEAM_DEPOT" -manifest "$steamManifest" \
                -username "$STEAM_USERNAME" -password "$STEAM_PASSWORD" -no-mobile -filelist "$1" -dir "$in" && return
              [ "$attempt" = 3 ] || { echo "attempt $attempt failed; retrying with a fresh code"; sleep 31; }
            done
            return 1
          }
          from_steam() {
            rm -rf "$in/Bundles2"
            echo Bundles2/_.index.bin > "$RUNNER_TEMP/index.txt"
            steam "$RUNNER_TEMP/index.txt"
            bundles
            sleep 31
            steam "$RUNNER_TEMP/bundles.txt"
            echo "fetched=Steam manifest $steamManifest" >> "$GITHUB_ENV"
          }
          mkdir -p "$in/Bundles2"
          status=$(curl -sS --retry 3 -o "$in/Bundles2/_.index.bin" -w '%{http_code}' "$cdn/Bundles2/_.index.bin")
          case $status in
            200)
              bundles
              if xargs -P 8 -I{} curl -fsS --retry 3 --create-dirs -o "$in/{}" "$cdn/{}" < "$RUNNER_TEMP/bundles.txt"; then
                echo "fetched=CDN $cdn" >> "$GITHUB_ENV"
              else
                echo "CDN download failed partway; starting over from Steam"
                from_steam
              fi
              ;;
            404)
              echo "$version is not on the CDN; using Steam"
              from_steam
              ;;
            *)
              echo "CDN returned $status for $cdn/Bundles2/_.index.bin"
              exit 1
              ;;
          esac

      - name: Dataset
        run: |
          pbt-extract -ooz "$RUNNER_TEMP/ooz/ooz" -version "$version" dataset "$RUNNER_TEMP/in" "$RUNNER_TEMP/out/$LEAGUE"
          id=$(jq -r .id "$RUNNER_TEMP/out/$LEAGUE/manifest.json")
          echo "id $id, game files from $fetched"
          echo "$LEAGUE: $version from $fetched, id \`$id\`" | tee -a "$GITHUB_STEP_SUMMARY" > "$RUNNER_TEMP/fetched-$LEAGUE.txt"

      - name: Tree art
        run: pbt-extract art "$RUNNER_TEMP/in" "$RUNNER_TEMP/out/$LEAGUE/art"

      - uses: actions/upload-artifact@v7
        with:
          name: dataset-${{ matrix.league }}
          path: ${{ runner.temp }}/out
          retention-days: 7

      - uses: actions/upload-artifact@v7
        with:
          name: fetched-${{ matrix.league }}
          path: ${{ runner.temp }}/fetched-${{ matrix.league }}.txt
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref }}

      - uses: actions/download-artifact@v8
        with:
          pattern: dataset-*
          merge-multiple: true
          path: ${{ runner.temp }}/out

      - uses: actions/download-artifact@v8
        with:
          pattern: fetched-*
          merge-multiple: true
          path: ${{ runner.temp }}/fetched

      - name: Update league folders and index.json
        run: |
          for d in "$RUNNER_TEMP"/out/*/; do
            league=$(basename "$d")
            dir=poe1/$league
            find "$dir" -mindepth 1 -maxdepth 1 ! -name source.json -exec rm -rf {} +
            cp -r "$d". "$dir/"
            version=$(jq -r .version "$dir/manifest.json")
            sum=$(sha256sum "$dir/manifest.json" | cut -c1-64)
            art=$(sha256sum "$dir/art/manifest.json" | cut -c1-64)
            jq --arg l "$league" --arg v "$version" --arg m "$sum" --arg a "$art" '.poe1[$l] = {version: $v, manifest: $m, art: $a}' index.json > "$RUNNER_TEMP/index.json"
            mv "$RUNNER_TEMP/index.json" index.json
            echo "$league: $version, id $(jq -r .id "$dir/manifest.json")"
          done
          git status --short

      - name: Commit
        env:
          GH_TOKEN: ${{ github.token }}
          LEAGUE: ${{ inputs.league }}
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "datasets unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          run=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            git commit -qm "data: rebuild from source.json" -m "Built by $run with pbt-extract $PBT_EXTRACT." -m "$(cat "$RUNNER_TEMP"/fetched/*.txt)"
            git push -q
          else
            branch=build/poe1-$LEAGUE-$GITHUB_RUN_ID
            git checkout -q -b "$branch"
            git commit -qm "data: rebuild poe1 $LEAGUE" -m "Built by $run with pbt-extract $PBT_EXTRACT." -m "$(cat "$RUNNER_TEMP"/fetched/*.txt)"
            git push -q origin "$branch"
            gh pr create --base main --head "$branch" --title "data: rebuild poe1 $LEAGUE" --body "Built from \`poe1/$LEAGUE/source.json\` by $run with pbt-extract \`$PBT_EXTRACT\`."
          fi
