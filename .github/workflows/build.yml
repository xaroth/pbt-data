name: build

# Builds league datasets and art from their source.json and checks them. On a pull request it
# builds every league whose source.json changed, or every league when this workflow, the Steam login
# or the publish script changed (such as a new PBT_EXTRACT); it publishes nothing. On main the same
# leagues are built and published to the bucket. Run by hand it builds one league, or all when none
# is given, and publishes when run on main.
on:
  pull_request:
    paths:
      - poe1/*/source.json
      - .github/workflows/build.yml
      - scripts/steam-code.py
      - scripts/bucket.py
  push:
    branches: [main]
    paths:
      - poe1/*/source.json
      - .github/workflows/build.yml
      - scripts/steam-code.py
      - scripts/bucket.py
  workflow_dispatch:
    inputs:
      league:
        description: League folder under poe1/, such as 3.29; empty for every league
        required: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  # Bump to rebuild every league with a newer extractor.
  PBT_EXTRACT: e51e6a6de74695dd4d6e670f419446121855afb1
  OOZ: ff5aeb9e45e362e8d6bb1199aa82406285dd2a18
  DEPOT_DOWNLOADER: DepotDownloader_3.4.0
  STEAM_APP: "238960"
  STEAM_DEPOT: "238961"
  BOTO3: "1.43.112"
  PUBLIC_URL: https://pbt-data.xaroth.nl

jobs:
  leagues:
    # Pull requests from forks get no secrets.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      leagues: ${{ steps.list.outputs.leagues }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: list
        env:
          INPUT_LEAGUE: ${{ inputs.league }}
          # A pull request counts its changes since the branch left main; a push, what it pushed.
          RANGE: ${{ github.event_name == 'pull_request' && format('{0}...{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || format('{0}..{1}', github.event.before, github.sha) }}
        run: |
          all=$(ls poe1/*/source.json | cut -d/ -f2)
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            leagues=${INPUT_LEAGUE:-$all}
          else
            changed=$(git diff --name-only "$RANGE")
            if grep -qE '^(\.github/workflows/build\.yml|scripts/(steam-code|bucket)\.py)$' <<< "$changed"; then
              leagues=$all
            else
              leagues=$(grep -E '^poe1/[^/]+/source\.json$' <<< "$changed" | while read -r f; do [ -f "$f" ] && echo "$f"; done | cut -d/ -f2)
            fi
          fi
          json=$(printf '%s\n' $leagues | jq -Rnc '[inputs | select(length > 0)]')
          echo "leagues: $json"
          echo "leagues=$json" >> "$GITHUB_OUTPUT"

  build:
    needs: leagues
    if: needs.leagues.outputs.leagues != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # One Steam login at a time.
      max-parallel: 1
      matrix:
        league: ${{ fromJSON(needs.leagues.outputs.leagues) }}
    env:
      LEAGUE: ${{ matrix.league }}
    steps:
      - uses: actions/checkout@v7

      - name: Read source.json
        run: |
          src=poe1/$LEAGUE/source.json
          for f in version steamManifest datSchemaCommit treeExportCommit; do
            v=$(jq -er ".$f" "$src")
            echo "$f=$v" >> "$GITHUB_ENV"
          done

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: false

      - name: Install pbt-extract
        run: GOBIN="$RUNNER_TEMP/bin" go install "github.com/xaroth/pbt-extract@$PBT_EXTRACT" && echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Cache ooz
        id: ooz
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/ooz
          key: ooz-${{ env.OOZ }}

      - name: Build ooz
        if: steps.ooz.outputs.cache-hit != 'true'
        run: |
          sudo apt-get install -y -qq libsodium-dev > /dev/null
          git clone -q https://github.com/zao/ooz "$RUNNER_TEMP/ooz-src"
          cd "$RUNNER_TEMP/ooz-src"
          git checkout -q "$OOZ"
          git submodule update -q --init
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target ooz -j
          mkdir -p "$RUNNER_TEMP/ooz" && cp build/ooz "$RUNNER_TEMP/ooz/"

      - name: Install DepotDownloader
        run: |
          gh release download "$DEPOT_DOWNLOADER" -R SteamRE/DepotDownloader -p DepotDownloader-linux-x64.zip -D "$RUNNER_TEMP"
          unzip -q "$RUNNER_TEMP/DepotDownloader-linux-x64.zip" -d "$RUNNER_TEMP/bin"
          chmod +x "$RUNNER_TEMP/bin/DepotDownloader"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Schema
        run: |
          git clone -q --filter=blob:none https://github.com/poe-tool-dev/dat-schema "$RUNNER_TEMP/dat-schema"
          cd "$RUNNER_TEMP/dat-schema"
          git -c advice.detachedHead=false checkout -q "$datSchemaCommit"
          npm ci --ignore-scripts --no-audit --no-fund --loglevel=error
          npm exec --no -- tsc
          node dist/cli.js > /dev/null
          mkdir -p "$RUNNER_TEMP/in"
          # validFor 1 is PoE1; older commits only write the combined schema.
          node -e '
          const fs = require("fs");
          const s = JSON.parse(fs.readFileSync("schema.min.json", "utf8"));
          const keep = (e) => (e.validFor & 1) !== 0;
          fs.writeFileSync(process.argv[1], JSON.stringify({ ...s, tables: s.tables.filter(keep), enumerations: s.enumerations.filter(keep) }));
          ' "$RUNNER_TEMP/in/schema.json"

      - name: Tree export
        run: |
          git clone -q --filter=blob:none --no-checkout https://github.com/grindinggear/skilltree-export "$RUNNER_TEMP/tree-src"
          cd "$RUNNER_TEMP/tree-src"
          git sparse-checkout set --no-cone /data.json /ruthless.json /alternate.json /assets/
          git -c advice.detachedHead=false checkout -q "$treeExportCommit"
          mkdir -p "$RUNNER_TEMP/in/tree"
          cp -r data.json ruthless.json alternate.json assets "$RUNNER_TEMP/in/tree/"

      # The CDN serves the live patch without a login; Steam serves any patch by manifest id.
      - name: Game files
        env:
          STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
          STEAM_PASSWORD: ${{ secrets.STEAM_PASSWORD }}
          STEAM_SHARED_SECRET: ${{ secrets.STEAM_SHARED_SECRET }}
        run: |
          in=$RUNNER_TEMP/in
          cdn=https://patch.poecdn.com/$version
          bundles() {
            pbt-extract -ooz "$RUNNER_TEMP/ooz/ooz" bundles "$in" > "$RUNNER_TEMP/bundles.txt"
            echo "$(wc -l < "$RUNNER_TEMP/bundles.txt") bundles"
          }
          # A code is accepted once; another build may have used the current one, so a failed
          # attempt retries with the next.
          steam() {
            for attempt in 1 2 3; do
              python3 -I scripts/steam-code.py | DepotDownloader -app "$STEAM_APP" -depot "$STEAM_DEPOT" -manifest "$steamManifest" \
                -username "$STEAM_USERNAME" -password "$STEAM_PASSWORD" -no-mobile -filelist "$1" -dir "$in" && return
              [ "$attempt" = 3 ] || { echo "attempt $attempt failed; retrying with a fresh code"; sleep 31; }
            done
            return 1
          }
          from_steam() {
            rm -rf "$in/Bundles2"
            echo Bundles2/_.index.bin > "$RUNNER_TEMP/index.txt"
            steam "$RUNNER_TEMP/index.txt"
            bundles
            sleep 31
            steam "$RUNNER_TEMP/bundles.txt"
            echo "fetched=Steam manifest $steamManifest" >> "$GITHUB_ENV"
          }
          mkdir -p "$in/Bundles2"
          status=$(curl -sS --retry 3 -o "$in/Bundles2/_.index.bin" -w '%{http_code}' "$cdn/Bundles2/_.index.bin")
          case $status in
            200)
              bundles
              if xargs -P 8 -I{} curl -fsS --retry 3 --create-dirs -o "$in/{}" "$cdn/{}" < "$RUNNER_TEMP/bundles.txt"; then
                echo "fetched=CDN $cdn" >> "$GITHUB_ENV"
              else
                echo "CDN download failed partway; starting over from Steam"
                from_steam
              fi
              ;;
            404)
              echo "$version is not on the CDN; using Steam"
              from_steam
              ;;
            *)
              echo "CDN returned $status for $cdn/Bundles2/_.index.bin"
              exit 1
              ;;
          esac

      - name: Dataset
        run: |
          pbt-extract -ooz "$RUNNER_TEMP/ooz/ooz" -version "$version" dataset "$RUNNER_TEMP/in" "$RUNNER_TEMP/out/$LEAGUE"
          id=$(jq -r .id "$RUNNER_TEMP/out/$LEAGUE/manifest.json")
          echo "$LEAGUE: $version from $fetched, id \`$id\`" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Art
        run: pbt-extract -ooz "$RUNNER_TEMP/ooz/ooz" art "$RUNNER_TEMP/in" "$RUNNER_TEMP/out/$LEAGUE/art"

      - name: Check
        run: python3 -I scripts/bucket.py check "$RUNNER_TEMP/out"

      - uses: actions/upload-artifact@v7
        with:
          name: dataset-${{ matrix.league }}
          path: ${{ runner.temp }}/out
          retention-days: 7

  publish:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # index.json is read, updated and written; two publishes at once could drop a league.
    concurrency:
      group: publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: dataset-*
          merge-multiple: true
          path: ${{ runner.temp }}/out

      - name: Install boto3
        run: python3 -m venv "$RUNNER_TEMP/venv" && "$RUNNER_TEMP/venv/bin/pip" install -q "boto3==$BOTO3"

      - name: Upload
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        # Explicit bash adds pipefail, so a failed publish is not hidden by tee.
        shell: bash
        run: |
          "$RUNNER_TEMP/venv/bin/python" -I scripts/bucket.py publish "$RUNNER_TEMP/out" | tee -a "$GITHUB_STEP_SUMMARY"

      # On every publish, not only when index.json changed: a run that wrote index.json and
      # failed before its purge is finished by the next.
      - name: Purge index.json
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_PURGE_TOKEN }}
          ZONE: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          curl -fsS -X POST "https://api.cloudflare.com/client/v4/zones/$ZONE/purge_cache" \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            --data "{\"files\":[\"$PUBLIC_URL/index.json\"]}" | jq -e .success

      # Through the public domain, so it also checks the purge and the custom domain.
      - name: Verify
        run: python3 -I scripts/bucket.py verify "$PUBLIC_URL" "$RUNNER_TEMP/out"
