name: scripts

on:
  pull_request:
    paths:
      - scripts/**
      - .github/workflows/scripts.yml
  push:
    branches: [main]
    paths:
      - scripts/**
      - .github/workflows/scripts.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 -m unittest discover -s scripts -v
